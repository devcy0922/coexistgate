[workspace]
resolver = "2"
members = [
    "crates/coexistgate-core",
    "crates/coexistgate-cli",
    "crates/coexistgate-github",
    "crates/coexistgate-lambda",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"
authors = ["CoexistGate contributors"]
repository = "https://github.com/devcy0922/coexistgate"
homepage = "https://devcy0922.github.io/coexistgate"
description = "Cross-artifact release safety engine"

[workspace.dependencies]
coexistgate-core = { path = "crates/coexistgate-core" }
coexistgate-github = { path = "crates/coexistgate-github" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
regex = "1"
tracing = "0.1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
jsonwebtoken = "9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
lambda_http = "0.13"
lambda_runtime = "0.13"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
rsa = "0.9"
rand = "0.8"
